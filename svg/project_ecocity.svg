<svg width="800" height="140" viewBox="0 0 800 140" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Fonts -->
    <style type="text/css"><![CDATA[
      @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;900&family=Share+Tech+Mono&display=swap');
      .proj-title {
        font-family: 'Cinzel', serif;
        font-weight: 900;
        font-size: 16px;
        fill: #EDE6D6;
        letter-spacing: 2px;
      }
      .proj-ver {
        font-family: 'Share Tech Mono', monospace;
        font-size: 10px;
        fill: #D6B36A;
        letter-spacing: 1px;
      }
      .proj-desc {
        font-family: 'Share Tech Mono', monospace;
        font-size: 11px;
        fill: #EDE6D6;
        opacity: 0.7;
        line-height: 1.5;
      }
      .proj-status {
        font-family: 'Share Tech Mono', monospace;
        font-size: 10px;
        fill: #EDE6D6;
        font-weight: bold;
        letter-spacing: 1.5px;
      }
    ]]></style>

    <!-- Checkerboard Ribbon Pattern -->
    <pattern id="checkers-small" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
      <rect width="5" height="5" fill="#9a0c16"/>
      <rect x="5" y="5" width="5" height="5" fill="#9a0c16"/>
      <rect x="5" width="5" height="5" fill="#C1121F"/>
      <rect y="5" width="5" height="5" fill="#C1121F"/>
    </pattern>

    <!-- Background Sepia Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090807"/>
      <stop offset="100%" stop-color="#141311"/>
    </linearGradient>

    <!-- Golden Glow Filter -->
    <filter id="glow-gold" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Crimson Glow Filter -->
    <filter id="glow-crimson" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="140" fill="url(#bgGrad)"/>

  <!-- Small diagonal crimson checked ribbon on the right side -->
  <path d="M 640 0 L 800 80 L 800 100 L 640 20 Z" fill="url(#checkers-small)" opacity="0.15"/>
  <line x1="640" y1="0" x2="800" y2="80" stroke="#C1121F" stroke-width="0.8" opacity="0.3"/>
  <line x1="640" y1="20" x2="800" y2="100" stroke="#C1121F" stroke-width="0.8" opacity="0.3"/>

  <!-- Main Card Frame with diagonal cuts -->
  <path d="M 12 12 L 740 12 L 755 27 L 788 27 L 788 128 L 12 128 Z" fill="none" stroke="#333333" stroke-width="1.2" />
  <path d="M 15 15 L 738 15 L 752 29 L 785 29 L 785 125 L 15 125 Z" fill="none" stroke="#D6B36A" stroke-width="0.8" opacity="0.8" />
  
  <!-- Left Side Accent Highlight -->
  <rect x="18" y="25" width="4" height="90" fill="#EDE6D6" opacity="0.4"/>
  <rect x="18" y="45" width="4" height="30" fill="#D6B36A"/>

  <!-- Left Side Diagonal Cut accent -->
  <path d="M 15 15 L 30 15 L 15 30 Z" fill="#D6B36A"/>

  <!-- Laterano Crest Accent (Shield/Feather) on Left -->
  <g transform="translate(42, 32)" stroke="#D6B36A" stroke-width="0.8" fill="none" opacity="0.8">
    <path d="M -6 -6 L 6 -6 L 8 2 L 0 10 L -8 2 Z" fill="#D6B36A" fill-opacity="0.1"/>
    <circle cx="0" cy="0" r="1.5" fill="#D6B36A"/>
  </g>

  <!-- Header Info -->
  <g transform="translate(60, 22)">
    <!-- Title -->
    <text x="0" y="15" class="proj-title">OP // ECOCITY-MATRIX</text>
    <text x="245" y="13" class="proj-ver">SEC_ID // 104-SIM-UNITY</text>
    
    <!-- Underline -->
    <line x1="0" y1="24" x2="690" y2="24" stroke="#333333" stroke-width="1"/>
    <rect x="0" y="24" width="120" height="2.5" fill="#D6B36A"/>
  </g>

  <!-- Description Body -->
  <g transform="translate(60, 66)">
    <text x="0" y="10" class="proj-desc">A comprehensive ecological city simulation matrix powered by Unity Engine.</text>
    <text x="0" y="26" class="proj-desc">Runs high-fidelity environment simulations, resource grid management, and active AI systems.</text>
  </g>

  <!-- Bottom Interactive Bar -->
  <g transform="translate(60, 102)">
    <!-- Status Dot -->
    <circle cx="5" cy="5" r="3.5" fill="#C1121F" filter="url(#glow-crimson)">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <!-- Status Text -->
    <text x="18" y="8" class="proj-status">SIM_MATRIX: ACTIVE [UNITY_ENGINE: 60FPS]</text>

    <!-- Initiate Access Button Graphic -->
    <g transform="translate(585, -8)">
      <path d="M 0 0 L 125 0 L 135 10 L 135 22 L 10 22 L 0 12 Z" fill="#11100E" stroke="#D6B36A" stroke-width="1.2"/>
      <path d="M 4 4 L 121 4 L 127 10 L 127 18 L 10 18 L 4 12 Z" fill="#D6B36A" opacity="0.1"/>
      <text x="70" y="14" font-family="Cinzel" font-size="8.5" font-weight="900" fill="#EDE6D6" text-anchor="middle" letter-spacing="1">INITIATE ACCESS</text>
    </g>
  </g>
</svg>
