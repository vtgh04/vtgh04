<svg width="400" height="300" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Fonts -->
    <style type="text/css"><![CDATA[
      @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;900&family=Share+Tech+Mono&display=swap');
      .skill-header {
        font-family: 'Cinzel', serif;
        font-weight: 900;
        font-size: 13px;
        fill: #EDE6D6;
        letter-spacing: 2px;
      }
      .skill-category {
        font-family: 'Cinzel', serif;
        font-weight: 900;
        font-size: 10px;
        fill: #D6B36A;
        letter-spacing: 1.5px;
      }
      .skill-label {
        font-family: 'Share Tech Mono', monospace;
        font-size: 11px;
        fill: #EDE6D6;
        letter-spacing: 1px;
      }
      .skill-val {
        font-family: 'Share Tech Mono', monospace;
        font-size: 11px;
        fill: #EDE6D6;
        font-weight: bold;
      }
    ]]></style>

    <!-- Background Sepia Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090807"/>
      <stop offset="100%" stop-color="#141311"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid-pattern" width="15" height="15" patternUnits="userSpaceOnUse">
      <path d="M 15 0 L 0 0 0 15" fill="none" stroke="#D6B36A" stroke-width="0.5" opacity="0.08"/>
    </pattern>

    <!-- Gold Glow -->
    <filter id="glow-gold" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Crimson Glow -->
    <filter id="glow-crimson" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="300" fill="url(#bgGrad)"/>
  <rect width="400" height="300" fill="url(#grid-pattern)"/>

  <!-- Border Frame -->
  <path d="M 10 10 L 390 10 L 390 290 L 10 290 Z" fill="none" stroke="#333333" stroke-width="1.2"/>
  <path d="M 13 13 L 387 13 L 387 287 L 13 287 Z" fill="none" stroke="#D6B36A" stroke-width="0.8" opacity="0.8"/>
  
  <!-- Corner Ornaments -->
  <path d="M 13 30 L 30 13" stroke="#D6B36A" stroke-width="1.5"/>
  <path d="M 387 30 L 370 13" stroke="#D6B36A" stroke-width="1.5"/>
  <path d="M 13 270 L 30 287" stroke="#D6B36A" stroke-width="1.5"/>
  <path d="M 387 270 L 370 287" stroke="#D6B36A" stroke-width="1.5"/>

  <!-- Left Accent Ribbon -->
  <rect x="16" y="25" width="2" height="250" fill="#D6B36A" opacity="0.5"/>
  <rect x="16" y="80" width="2" height="40" fill="#C1121F"/>

  <!-- Header -->
  <g transform="translate(30, 25)">
    <text x="0" y="15" class="skill-header">SYS // CORE_ENGINES</text>
    <line x1="0" y1="24" x2="340" y2="24" stroke="#333333" stroke-width="1"/>
    <rect x="0" y="24" width="80" height="2" fill="#D6B36A"/>
    <!-- Small Laterano cross symbol -->
    <path d="M 330 8 L 338 8 M 334 4 L 334 12" stroke="#D6B36A" stroke-width="0.8"/>
  </g>

  <!-- COLUMN 1: FRONTEND MODULES -->
  <g transform="translate(30, 70)">
    <text x="0" y="10" class="skill-category">I. INTERFACE_MODULES</text>
    <line x1="0" y1="16" x2="160" y2="16" stroke="#C1121F" stroke-width="1" opacity="0.6"/>
    
    <!-- Skill 1: React / Next.js -->
    <g transform="translate(0, 30)">
      <text x="0" y="10" class="skill-label">REACT_NEXTJS</text>
      <text x="160" y="10" class="skill-val" text-anchor="end">90%</text>
      <!-- Segmented progress bar (total width 160) -->
      <g transform="translate(0, 16)">
        <rect x="0" y="0" width="160" height="6" fill="#11100E" stroke="#333333" stroke-width="0.8"/>
        <!-- 9 segments, 8 filled with gold, 1 active crimson, 1 dark -->
        <rect x="2" y="1.5" width="14" height="3" fill="#D6B36A"/>
        <rect x="18" y="1.5" width="14" height="3" fill="#D6B36A"/>
        <rect x="34" y="1.5" width="14" height="3" fill="#D6B36A"/>
        <rect x="50" y="1.5" width="14" height="3" fill="#D6B36A"/>
        <rect x="66" y="1.5" width="14" height="3" fill="#D6B36A"/>
        <rect x="82" y="1.5" width="14" height="3" fill="#D6B36A"/>
        <rect x="98" y="1.5" width="14" height="3" fill="#D6B36A"/>
        <rect x="114" y="1.5" width="14" height="3" fill="#D6B36A"/>
        <rect x="130" y="1.5" width="14" height="3" fill="#C1121F" filter="url(#glow-crimson)"/>
        <rect x="146" y="1.5" width="12" height="3" fill="#333333"/>
      </g>
    </g>

    <!-- Skill 2: TS / JS -->
    <g transform="translate(0, 75)">
      <text x="0" y="10" class="skill-label">TS_JS_ES6</text>
      <text x="160" y="10" class="skill-val" text-anchor="end">85%</text>
      <g transform="translate(0, 16)">
        <rect x="0" y="0" width="160" height="6" fill="#11100E" stroke="#333333" stroke-width="0.8"/>
        <rect x="2" y="1.5" width="14" height="3" fill="#D6B36A"/>
        <rect x="18" y="1.5" width="14" height="3" fill="#D6B36A"/>
        <rect x="34" y="1.5" width="14" height="3" fill="#D6B36A"/>
        <rect x="50" y="1.5" width="14" height="3" fill="#D6B36A"/>
        <rect x="66" y="1.5" width="14" height="3" fill="#D6B36A"/>
        <rect x="82" y="1.5" width="14" height="3" fill="#D6B36A"/>
        <rect x="98" y="1.5" width="14" height="3" fill="#D6B36A"/>
        <rect x="114" y="1.5" width="14" height="3" fill="#C1121F" filter="url(#glow-crimson)"/>
        <rect x="130" y="1.5" width="14" height="3" fill="#333333"/>
        <rect x="146" y="1.5" width="12" height="3" fill="#333333"/>
      </g>
    </g>

    <!-- Skill 3: HTML / CSS / Tailwind -->
    <g transform="translate(0, 120)">
      <text x="0" y="10" class="skill-label">UI_CSS_TAILWIND</text>
      <text x="160" y="10" class="skill-val" text-anchor="end">95%</text>
      <g transform="translate(0, 16)">
        <rect x="0" y="0" width="160" height="6" fill="#11100E" stroke="#333333" stroke-width="0.8"/>
        <rect x="2" y="1.5" width="14" height="3" fill="#D6B36A"/>
        <rect x="18" y="1.5" width="14" height="3" fill="#D6B36A"/>
        <rect x="34" y="1.5" width="14" height="3" fill="#D6B36A"/>
        <rect x="50" y="1.5" width="14" height="3" fill="#D6B36A"/>
        <rect x="66" y="1.5" width="14" height="3" fill="#D6B36A"/>
        <rect x="82" y="1.5" width="14" height="3" fill="#D6B36A"/>
        <rect x="98" y="1.5" width="14" height="3" fill="#D6B36A"/>
        <rect x="114" y="1.5" width="14" height="3" fill="#D6B36A"/>
        <rect x="130" y="1.5" width="14" height="3" fill="#D6B36A"/>
        <rect x="146" y="1.5" width="12" height="3" fill="#C1121F" filter="url(#glow-crimson)"/>
      </g>
    </g>
  </g>

  <!-- COLUMN 2: BACKEND/LOGIC MODULES -->
  <g transform="translate(210, 70)">
    <text x="0" y="10" class="skill-category">II. PROCESSING_ENGINES</text>
    <line x1="0" y1="16" x2="160" y2="16" stroke="#C1121F" stroke-width="1" opacity="0.6"/>
    
    <!-- Skill 1: Node.js / Express -->
    <g transform="translate(0, 30)">
      <text x="0" y="10" class="skill-label">NODE_EXPRESS</text>
      <text x="160" y="10" class="skill-val" text-anchor="end">85%</text>
      <g transform="translate(0, 16)">
        <rect x="0" y="0" width="160" height="6" fill="#11100E" stroke="#333333" stroke-width="0.8"/>
        <rect x="2" y="1.5" width="14" height="3" fill="#D6B36A"/>
        <rect x="18" y="1.5" width="14" height="3" fill="#D6B36A"/>
        <rect x="34" y="1.5" width="14" height="3" fill="#D6B36A"/>
        <rect x="50" y="1.5" width="14" height="3" fill="#D6B36A"/>
        <rect x="66" y="1.5" width="14" height="3" fill="#D6B36A"/>
        <rect x="82" y="1.5" width="14" height="3" fill="#D6B36A"/>
        <rect x="98" y="1.5" width="14" height="3" fill="#D6B36A"/>
        <rect x="114" y="1.5" width="14" height="3" fill="#C1121F" filter="url(#glow-crimson)"/>
        <rect x="130" y="1.5" width="14" height="3" fill="#333333"/>
        <rect x="146" y="1.5" width="12" height="3" fill="#333333"/>
      </g>
    </g>

    <!-- Skill 2: Python / Fast API -->
    <g transform="translate(0, 75)">
      <text x="0" y="10" class="skill-label">PYTHON_FASTAPI</text>
      <text x="160" y="10" class="skill-val" text-anchor="end">80%</text>
      <g transform="translate(0, 16)">
        <rect x="0" y="0" width="160" height="6" fill="#11100E" stroke="#333333" stroke-width="0.8"/>
        <rect x="2" y="1.5" width="14" height="3" fill="#D6B36A"/>
        <rect x="18" y="1.5" width="14" height="3" fill="#D6B36A"/>
        <rect x="34" y="1.5" width="14" height="3" fill="#D6B36A"/>
        <rect x="50" y="1.5" width="14" height="3" fill="#D6B36A"/>
        <rect x="66" y="1.5" width="14" height="3" fill="#D6B36A"/>
        <rect x="82" y="1.5" width="14" height="3" fill="#D6B36A"/>
        <rect x="98" y="1.5" width="14" height="3" fill="#C1121F" filter="url(#glow-crimson)"/>
        <rect x="114" y="1.5" width="14" height="3" fill="#333333"/>
        <rect x="130" y="1.5" width="14" height="3" fill="#333333"/>
        <rect x="146" y="1.5" width="12" height="3" fill="#333333"/>
      </g>
    </g>

    <!-- Skill 3: DB (SQL / NoSQL) -->
    <g transform="translate(0, 120)">
      <text x="0" y="10" class="skill-label">SQL_NOSQL_DB</text>
      <text x="160" y="10" class="skill-val" text-anchor="end">85%</text>
      <g transform="translate(0, 16)">
        <rect x="0" y="0" width="160" height="6" fill="#11100E" stroke="#333333" stroke-width="0.8"/>
        <rect x="2" y="1.5" width="14" height="3" fill="#D6B36A"/>
        <rect x="18" y="1.5" width="14" height="3" fill="#D6B36A"/>
        <rect x="34" y="1.5" width="14" height="3" fill="#D6B36A"/>
        <rect x="50" y="1.5" width="14" height="3" fill="#D6B36A"/>
        <rect x="66" y="1.5" width="14" height="3" fill="#D6B36A"/>
        <rect x="82" y="1.5" width="14" height="3" fill="#D6B36A"/>
        <rect x="98" y="1.5" width="14" height="3" fill="#D6B36A"/>
        <rect x="114" y="1.5" width="14" height="3" fill="#C1121F" filter="url(#glow-crimson)"/>
        <rect x="130" y="1.5" width="14" height="3" fill="#333333"/>
        <rect x="146" y="1.5" width="12" height="3" fill="#333333"/>
      </g>
    </g>
  </g>

  <!-- Bottom status ticker -->
  <g transform="translate(30, 268)">
    <circle cx="5" cy="5" r="2.5" fill="#C1121F" filter="url(#glow-crimson)">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <text x="15" y="8" font-family="Share Tech Mono" font-size="9" fill="#EDE6D6" opacity="0.7">STATUS: SUB-SYSTEM INTEGRITY NOMINAL</text>
    <text x="340" y="8" font-family="Share Tech Mono" font-size="9" fill="#D6B36A" text-anchor="end">MATRIX_V4.0</text>
  </g>
</svg>
