<svg width="800" height="170" viewBox="0 0 800 170" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Fonts -->
    <style type="text/css"><![CDATA[
      @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;900&family=Share+Tech+Mono&display=swap');
      .hud-title {
        font-family: 'Cinzel', serif;
        font-weight: 900;
        font-size: 34px;
        fill: #EDE6D6;
        letter-spacing: 5px;
      }
      .hud-subtitle {
        font-family: 'Cinzel', serif;
        font-weight: 600;
        font-size: 11px;
        fill: #D6B36A;
        letter-spacing: 3px;
      }
      .hud-mono {
        font-family: 'Share Tech Mono', monospace;
        font-size: 10px;
        fill: #EDE6D6;
        opacity: 0.6;
        letter-spacing: 1.5px;
      }
      .hud-mono-bold {
        font-family: 'Share Tech Mono', monospace;
        font-size: 11px;
        font-weight: bold;
        fill: #EDE6D6;
      }
      .hud-alert {
        font-family: 'Share Tech Mono', monospace;
        font-size: 9px;
        fill: #C1121F;
        font-weight: bold;
        letter-spacing: 1px;
      }
    ]]></style>

    <!-- Checkerboard Ribbon Pattern -->
    <pattern id="checkers" width="20" height="20" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
      <rect width="10" height="10" fill="#9a0c16"/>
      <rect x="10" y="10" width="10" height="10" fill="#9a0c16"/>
      <rect x="10" width="10" height="10" fill="#C1121F"/>
      <rect y="10" width="10" height="10" fill="#C1121F"/>
    </pattern>

    <!-- Background Sepia Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090807"/>
      <stop offset="60%" stop-color="#0F0E0C"/>
      <stop offset="100%" stop-color="#141311"/>
    </linearGradient>

    <!-- Golden Glow Filter -->
    <filter id="glow-gold" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Crimson Glow Filter -->
    <filter id="glow-crimson" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Sepia Backdrop -->
  <rect width="800" height="170" fill="url(#bgGrad)"/>

  <!-- Diagonal Crimson Checked Ribbon -->
  <path d="M -50 80 L 850 145 L 850 160 L -50 95 Z" fill="url(#checkers)" opacity="0.3"/>
  <path d="M -50 80 L 850 145" stroke="#C1121F" stroke-width="1" opacity="0.6"/>
  <path d="M -50 95 L 850 160" stroke="#C1121F" stroke-width="1" opacity="0.6"/>

  <!-- Cathedral Symmetrical Arch Silhouette (Background Overlay) -->
  <path d="M 260 170 L 260 110 C 260 40 330 15 400 15 C 470 15 540 40 540 110 L 540 170" fill="none" stroke="#D6B36A" stroke-width="1" opacity="0.25"/>
  <path d="M 270 170 L 270 112 C 270 48 335 22 400 22 C 465 22 530 48 530 112 L 530 170" fill="none" stroke="#D6B36A" stroke-width="0.5" opacity="0.15"/>
  <path d="M 390 15 L 400 0 L 410 15 Z" fill="#D6B36A" opacity="0.25"/>

  <!-- Symmetrical Ornamental Pillars & Borders -->
  <rect x="10" y="10" width="780" height="150" fill="none" stroke="#D6B36A" stroke-width="1.2" opacity="0.75"/>
  <rect x="14" y="14" width="772" height="142" fill="none" stroke="#D6B36A" stroke-width="0.5" opacity="0.35" stroke-dasharray="10, 5"/>
  
  <!-- Gothic Corner Accents -->
  <!-- Top-Left -->
  <path d="M 10 35 L 10 10 L 35 10 M 14 25 L 14 14 L 25 14" fill="none" stroke="#D6B36A" stroke-width="1.5"/>
  <!-- Top-Right -->
  <path d="M 790 35 L 790 10 L 765 10 M 786 25 L 786 14 L 775 14" fill="none" stroke="#D6B36A" stroke-width="1.5"/>
  <!-- Bottom-Left -->
  <path d="M 10 135 L 10 160 L 35 160 M 14 145 L 14 156 L 25 156" fill="none" stroke="#D6B36A" stroke-width="1.5"/>
  <!-- Bottom-Right -->
  <path d="M 790 135 L 790 160 L 765 160 M 786 145 L 786 156 L 775 156" fill="none" stroke="#D6B36A" stroke-width="1.5"/>

  <!-- Left Symmetrical Hanging Chain & Lantern -->
  <line x1="75" y1="10" x2="75" y2="75" stroke="#D6B36A" stroke-width="0.75" opacity="0.5"/>
  <g transform="translate(75, 75)">
    <!-- Arch Window Lantern -->
    <path d="M -6 0 L 6 0 L 4 3 L -4 3 Z" fill="#D6B36A" opacity="0.8"/>
    <path d="M -5 3 L 5 3 L 3 14 L -3 14 Z" fill="none" stroke="#D6B36A" stroke-width="0.8"/>
    <path d="M -3 14 L 3 14 L 0 19 Z" fill="#D6B36A" opacity="0.8"/>
    <circle cx="0" cy="8" r="1.5" fill="#EDE6D6"/>
  </g>

  <!-- Right Symmetrical Hanging Chain & Sunburst -->
  <line x1="725" y1="10" x2="725" y2="65" stroke="#D6B36A" stroke-width="0.75" opacity="0.5"/>
  <g transform="translate(725, 65)">
    <!-- Starburst -->
    <circle cx="0" cy="0" r="4" fill="none" stroke="#D6B36A" stroke-width="0.75"/>
    <path d="M 0 -6 L 0 -11 M 0 6 L 0 11 M -6 0 L -11 0 M 6 0 L 11 0" stroke="#D6B36A" stroke-width="0.75"/>
    <path d="M -4 -4 L -7 -7 M 4 4 L 7 7 M -4 4 L -7 7 M 4 -4 L 7 -7" stroke="#D6B36A" stroke-width="0.5"/>
  </g>

  <!-- Laterano Faction Crest (Right Column) -->
  <g transform="translate(640, 85)">
    <!-- Halo and Wings -->
    <circle cx="0" cy="0" r="24" stroke="#D6B36A" stroke-width="0.75" stroke-dasharray="2,3" opacity="0.7"/>
    <circle cx="0" cy="0" r="18" stroke="#D6B36A" stroke-width="1" opacity="0.5"/>
    <!-- Outer winged polygons -->
    <path d="M -18 -3 C -27 -11 -37 -3 -34 9 C -30 13 -24 5 -18 -3 Z" fill="#D6B36A" fill-opacity="0.1" stroke="#D6B36A" stroke-width="0.75"/>
    <path d="M 18 -3 C 27 -11 37 -3 34 9 C 30 13 24 5 18 -3 Z" fill="#D6B36A" fill-opacity="0.1" stroke="#D6B36A" stroke-width="0.75"/>
    <!-- Small central star -->
    <polygon points="0,-4 1.5,-1 5,-1 2.5,1 3.5,4 0,2 -3.5,4 -2.5,1 -5,-1 -1.5,-1" fill="#D6B36A"/>
    
    <text x="35" y="-3" class="hud-mono" font-size="8" fill="#D6B36A">REG_ID // LATERANO-N3</text>
    <text x="35" y="7" class="hud-mono-bold" font-size="8">COORD // 21.02° N 105.83° E</text>
  </g>

  <!-- Main Center Header Data Block -->
  <g transform="translate(130, 48)">
    <!-- Classification / Warning Badge -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="12" height="12" fill="#C1121F" filter="url(#glow-crimson)"/>
      <path d="M 3 3 L 9 3 L 6 9 Z" fill="#EDE6D6"/>
      <text x="18" y="9" class="hud-alert">OPERATIVE STATUS: SANCTIFIED</text>
    </g>
    
    <!-- Large Styled Username in serif display font -->
    <text x="0" y="46" class="hud-title" filter="url(#glow-gold)">V. T. G. HUY</text>
    
    <!-- Subtitle / Role -->
    <text x="2" y="66" class="hud-subtitle">AI &amp; RAG ENGINEER // INTERACTIVE LOGIC ARCHITECT</text>
    
    <!-- Underline with gold highlights -->
    <line x1="0" y1="76" x2="420" y2="76" stroke="#D6B36A" stroke-width="1.2" opacity="0.6"/>
    <rect x="150" y="75" width="50" height="3" fill="#D6B36A" filter="url(#glow-gold)"/>
  </g>

  <!-- Bottom Technical Row / Signature -->
  <g transform="translate(130, 142)">
    <circle cx="5" cy="-3" r="3" fill="#EDE6D6">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="15" y="0" class="hud-mono-bold">SYS_ONLINE: LAT_NET_STABLE</text>
  </g>
</svg>
