<svg width="800" height="24" viewBox="0 0 800 24" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Left Line Segment -->
  <line x1="10" y1="12" x2="350" y2="12" stroke="#D6B36A" stroke-width="0.8" opacity="0.6"/>
  <line x1="40" y1="14" x2="320" y2="14" stroke="#D6B36A" stroke-width="0.5" stroke-dasharray="3,6" opacity="0.3"/>
  <circle cx="10" cy="12" r="1.5" fill="#D6B36A"/>
  
  <!-- Right Line Segment -->
  <line x1="450" y1="12" x2="790" y2="12" stroke="#D6B36A" stroke-width="0.8" opacity="0.6"/>
  <line x1="480" y1="14" x2="760" y2="14" stroke="#D6B36A" stroke-width="0.5" stroke-dasharray="3,6" opacity="0.3"/>
  <circle cx="790" cy="12" r="1.5" fill="#D6B36A"/>

  <!-- Center Celestial Emblem -->
  <g transform="translate(400, 12)" stroke="#D6B36A" fill="none">
    <!-- Starburst in the center -->
    <circle cx="0" cy="0" r="3" fill="#EDE6D6" stroke="none"/>
    <!-- Pointed rays -->
    <path d="M 0 -8 L 0 -4 M 0 4 L 0 8 M -8 0 L -4 0 M 4 0 L 8 0" stroke-width="0.8"/>
    <path d="M -5 -5 L -2 -2 M 2 2 L 5 5 M -5 5 L -2 2 M 2 -2 L 5 -5" stroke-width="0.6"/>
    <!-- Crescent moons left and right -->
    <path d="M -14 -4 C -10 -4 -10 4 -14 4 C -12 2 -12 -2 -14 -4 Z" fill="#D6B36A" stroke-width="0.5"/>
    <path d="M 14 -4 C 10 -4 10 4 14 4 C 12 2 12 -2 14 -4 Z" fill="#D6B36A" stroke-width="0.5"/>
    <!-- Outer small dots -->
    <circle cx="-22" cy="0" r="1" fill="#EDE6D6" stroke="none"/>
    <circle cx="22" cy="0" r="1" fill="#EDE6D6" stroke="none"/>
  </g>
</svg>
