<svg width="800" height="160" viewBox="0 0 800 160" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Fonts -->
    <style type="text/css"><![CDATA[
      @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Share+Tech+Mono&display=swap');
      .hud-title {
        font-family: 'Orbitron', -apple-system, sans-serif;
        font-weight: 900;
        font-size: 32px;
        fill: #FFFFFF;
        letter-spacing: 6px;
      }
      .hud-subtitle {
        font-family: 'Orbitron', -apple-system, sans-serif;
        font-weight: 700;
        font-size: 11px;
        fill: #CCCCCC;
        letter-spacing: 3px;
      }
      .hud-mono {
        font-family: 'Share Tech Mono', monospace;
        font-size: 10px;
        fill: #888888;
        letter-spacing: 1.5px;
      }
      .hud-mono-bold {
        font-family: 'Share Tech Mono', monospace;
        font-size: 11px;
        font-weight: bold;
        fill: #FFFFFF;
      }
      .hud-alert {
        font-family: 'Share Tech Mono', monospace;
        font-size: 10px;
        fill: #FFFFFF;
        font-weight: bold;
        letter-spacing: 1px;
      }
    ]]></style>
    
    <!-- Background Grid -->
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#222222" stroke-width="0.75" opacity="0.3"/>
    </pattern>
    
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070707"/>
      <stop offset="50%" stop-color="#0E0E0E"/>
      <stop offset="100%" stop-color="#181818"/>
    </linearGradient>

    <!-- Scanline Pattern -->
    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="4" y2="0" stroke="#000000" stroke-width="1.5" opacity="0.25"/>
    </pattern>

    <!-- Glowing effect -->
    <filter id="glow-white" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Rect -->
  <rect width="800" height="160" fill="url(#bgGrad)"/>
  <rect width="800" height="160" fill="url(#grid)"/>

  <!-- Tactical Borders & Frame Elements with Diagonal Cuts -->
  <path d="M 12 12 L 730 12 L 745 27 L 788 27 L 788 148 L 12 148 Z" fill="none" stroke="#444444" stroke-width="1" />
  <path d="M 15 15 L 728 15 L 742 29 L 785 29 L 785 145 L 15 145 Z" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.8" />
  
  <!-- Corner Tech Highlights -->
  <!-- Top-Left Corner -->
  <path d="M 10 35 L 10 10 L 35 10" fill="none" stroke="#ffffff" stroke-width="3"/>
  <rect x="14" y="14" width="4" height="4" fill="#ffffff"/>
  
  <!-- Top-Right Accent Cut -->
  <path d="M 755 10 L 790 10 L 790 45" fill="none" stroke="#444444" stroke-width="2"/>
  
  <!-- Bottom-Left -->
  <path d="M 10 125 L 10 150 L 35 150" fill="none" stroke="#444444" stroke-width="2"/>
  
  <!-- Bottom-Right -->
  <path d="M 765 150 L 790 150 L 790 125" fill="none" stroke="#ffffff" stroke-width="3"/>
  <rect x="782" y="142" width="4" height="4" fill="#ffffff"/>

  <!-- Left Accent Bar -->
  <rect x="18" y="25" width="4" height="110" fill="#ffffff" opacity="0.5"/>
  <rect x="18" y="55" width="4" height="30" fill="#ffffff"/>
  
  <!-- Decorative Technical Lines & Dots -->
  <line x1="30" y1="20" x2="350" y2="20" stroke="#333333" stroke-dasharray="5,5"/>
  <line x1="30" y1="140" x2="600" y2="140" stroke="#333333" stroke-dasharray="10,5"/>

  <!-- Navigation Tabs (Y2K Visual Novel Style) -->
  <g transform="translate(35, 20)">
    <!-- Active Tab -->
    <path d="M 0 0 L 90 0 L 100 14 L 0 14 Z" fill="#ffffff" />
    <text x="12" y="10" font-family="Share Tech Mono" font-size="9" fill="#000000" font-weight="bold">DOSSIER.IDX</text>
    
    <!-- Inactive Tab 1 -->
    <path d="M 105 0 L 195 0 L 205 14 L 105 14 Z" fill="#151515" stroke="#333333" stroke-width="1" />
    <text x="117" y="10" font-family="Share Tech Mono" font-size="9" fill="#888888">SYSTEM.CFG</text>
    
    <!-- Inactive Tab 2 -->
    <path d="M 210 0 L 300 0 L 310 14 L 210 14 Z" fill="#151515" stroke="#333333" stroke-width="1" />
    <text x="222" y="10" font-family="Share Tech Mono" font-size="9" fill="#888888">NETWORK.LOG</text>
  </g>

  <!-- Barcode Decoration (Top Right) -->
  <g transform="translate(635, 38)">
    <rect x="0" y="0" width="3" height="18" fill="#ffffff" />
    <rect x="5" y="0" width="1" height="18" fill="#ffffff" />
    <rect x="8" y="0" width="2" height="18" fill="#ffffff" opacity="0.7"/>
    <rect x="12" y="0" width="4" height="18" fill="#ffffff" />
    <rect x="18" y="0" width="1" height="18" fill="#ffffff" opacity="0.5"/>
    <rect x="21" y="0" width="3" height="18" fill="#ffffff" />
    <rect x="26" y="0" width="1" height="18" fill="#ffffff" />
    <rect x="29" y="0" width="2" height="18" fill="#ffffff" />
    <text x="36" y="12" font-family="Share Tech Mono" font-size="8" fill="#ffffff" letter-spacing="1">VTG-04</text>
  </g>

  <!-- Grid Tech Graphics (Right-hand Side Dial) -->
  <g transform="translate(660, 48)">
    <circle cx="55" cy="50" r="40" fill="none" stroke="#333333" stroke-width="1"/>
    <circle cx="55" cy="50" r="28" fill="none" stroke="#444444" stroke-width="0.5" stroke-dasharray="4,2"/>
    <circle cx="55" cy="50" r="4" fill="#ffffff"/>
    <!-- Radar Line Sweep -->
    <line x1="55" y1="50" x2="83" y2="22" stroke="#ffffff" stroke-width="1.5" opacity="0.8">
      <animateTransform attributeName="transform" type="rotate" from="0 55 50" to="360 55 50" dur="8s" repeatCount="indefinite"/>
    </line>
    <!-- Crosshair ticks -->
    <path d="M 55 5 L 55 12 M 55 88 L 55 95 M 10 50 L 17 50 M 93 50 L 100 50" stroke="#444444" stroke-width="1"/>
    
    <text x="-48" y="80" class="hud-mono" font-size="8">VN_SRV // STATUS: OK</text>
    <text x="-48" y="90" class="hud-mono-bold" font-size="8">COORD // 21.02°N 105.83°E</text>
  </g>

  <!-- Left Header Data Block -->
  <g transform="translate(40, 48)">
    <!-- Classification -->
    <text x="0" y="12" class="hud-alert">// OPERATIVE MAIN TERMINAL // COGNITIVE NET STATE: ENABLED</text>
    <rect x="0" y="20" width="120" height="1.5" fill="#ffffff"/>
    
    <!-- Name -->
    <text x="0" y="56" class="hud-title">V. T. G. HUY</text>
    
    <!-- Subtitle / Role -->
    <text x="0" y="78" class="hud-subtitle">AI &amp; RAG ENGINEER // INTERACTIVE LOGIC ARCHITECT</text>
    
    <!-- Underline -->
    <line x1="0" y1="90" x2="520" y2="90" stroke="#333333" stroke-width="1.5"/>
    <rect x="180" y="89" width="40" height="3" fill="#ffffff" filter="url(#glow-white)"/>
  </g>

  <!-- Bottom Technical Row -->
  <g transform="translate(40, 138)">
    <!-- Blinking Dot -->
    <circle cx="5" cy="-3" r="3" fill="#ffffff" filter="url(#glow-white)">
      <animate attributeName="opacity" values="1;0.2;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="15" y="0" class="hud-mono-bold">SYS_DAEMON: ACTIVE_NODE</text>
  </g>

  <!-- Scanlines overlay for holographic CRT look -->
  <rect x="12" y="12" width="776" height="136" fill="url(#scanlines)" pointer-events="none" opacity="0.3"/>
</svg>
