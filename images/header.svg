<svg width="800" height="160" viewBox="0 0 800 160" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Fonts -->
    <style type="text/css"><![CDATA[
      @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Share+Tech+Mono&display=swap');
      .hud-title {
        font-family: 'Orbitron', -apple-system, sans-serif;
        font-weight: 900;
        font-size: 32px;
        fill: #FFFFFF;
        letter-spacing: 6px;
      }
      .hud-subtitle {
        font-family: 'Orbitron', -apple-system, sans-serif;
        font-weight: 700;
        font-size: 11px;
        fill: #09DBC7;
        letter-spacing: 3px;
      }
      .hud-mono {
        font-family: 'Share Tech Mono', monospace;
        font-size: 10px;
        fill: #94A3B8;
        letter-spacing: 1.5px;
      }
      .hud-mono-bold {
        font-family: 'Share Tech Mono', monospace;
        font-size: 11px;
        font-weight: bold;
        fill: #09DBC7;
      }
      .hud-alert {
        font-family: 'Share Tech Mono', monospace;
        font-size: 10px;
        fill: #BD0927;
        font-weight: bold;
        letter-spacing: 1px;
      }
    ]]></style>
    
    <!-- Background Grid -->
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#17364F" stroke-width="0.75" opacity="0.25"/>
    </pattern>
    
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1A2F"/>
      <stop offset="60%" stop-color="#0D1A2F"/>
      <stop offset="100%" stop-color="#1A0B1E"/> <!-- Subtle touch of deep cyber purple/crimson at the corner -->
    </linearGradient>

    <!-- Glowing effect -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Rect -->
  <rect width="800" height="160" fill="url(#bgGrad)"/>
  <rect width="800" height="160" fill="url(#grid)"/>

  <!-- Tactical Borders & Frame Elements -->
  <rect x="10" y="10" width="780" height="140" fill="none" stroke="#17364F" stroke-width="1" opacity="0.8"/>
  
  <!-- Corner Tech Highlights (Tactical HUD Style) -->
  <!-- Top-Left -->
  <path d="M 10 30 L 10 10 L 30 10" fill="none" stroke="#09DBC7" stroke-width="3"/>
  <rect x="14" y="14" width="4" height="4" fill="#09DBC7"/>
  
  <!-- Top-Right -->
  <path d="M 770 10 L 790 10 L 790 30" fill="none" stroke="#17364F" stroke-width="2"/>
  
  <!-- Bottom-Left -->
  <path d="M 10 130 L 10 150 L 30 150" fill="none" stroke="#17364F" stroke-width="2"/>
  
  <!-- Bottom-Right -->
  <path d="M 770 150 L 790 150 L 790 130" fill="none" stroke="#BD0927" stroke-width="3"/>
  <rect x="782" y="142" width="4" height="4" fill="#BD0927"/>

  <!-- Left Accent Bar -->
  <rect x="18" y="25" width="4" height="110" fill="#BD0927"/>
  
  <!-- Decorative Technical Lines & Dots -->
  <line x1="30" y1="20" x2="350" y2="20" stroke="#17364F" stroke-dasharray="5,5"/>
  <line x1="30" y1="140" x2="600" y2="140" stroke="#17364F" stroke-dasharray="10,5"/>

  <!-- Grid Tech Graphics (Right-hand Side) -->
  <g transform="translate(640, 25)">
    <!-- Tech Dial / Radar Circle -->
    <circle cx="65" cy="55" r="45" fill="none" stroke="#17364F" stroke-width="1"/>
    <circle cx="65" cy="55" r="30" fill="none" stroke="#17364F" stroke-width="0.5" stroke-dasharray="4,2"/>
    <circle cx="65" cy="55" r="5" fill="#BD0927"/>
    <!-- Radar Line Sweep -->
    <line x1="65" y1="55" x2="97" y2="23" stroke="#09DBC7" stroke-width="1.5" opacity="0.8">
      <animateTransform attributeName="transform" type="rotate" from="0 65 55" to="360 65 55" dur="6s" repeatCount="indefinite"/>
    </line>
    <!-- Tech Crosshair and Labels -->
    <path d="M 65 5 L 65 15 M 65 95 L 65 105 M 15 55 L 25 55 M 105 55 L 115 55" stroke="#17364F" stroke-width="1"/>
    <text x="5" y="-3" class="hud-mono" font-size="8">SYS_SCAN // RADAR_04</text>
    <text x="120" y="58" class="hud-mono" font-size="8">VN_SRV</text>
    <text x="120" y="70" class="hud-mono-bold" font-size="8">21.02° N</text>
    <text x="120" y="80" class="hud-mono-bold" font-size="8">105.83° E</text>
  </g>

  <!-- Left Header Data Block -->
  <g transform="translate(40, 25)">
    <!-- Classification -->
    <text x="0" y="12" class="hud-alert">// PRODUCTION NODE GRID // NETWORK: SECURED</text>
    <rect x="0" y="20" width="80" height="2" fill="#BD0927"/>
    
    <!-- Name -->
    <text x="0" y="56" class="hud-title">V. T. G. HUY</text>
    
    <!-- Subtitle / Role -->
    <text x="0" y="78" class="hud-subtitle">AI &amp; RAG ENGINEER // INTERACTIVE LOGIC ARCHITECT</text>
    
    <!-- Underline -->
    <line x1="0" y1="90" x2="520" y2="90" stroke="#17364F" stroke-width="1.5"/>
    <!-- Highlight block in the line -->
    <rect x="180" y="89" width="40" height="3" fill="#09DBC7" filter="url(#glow-cyan)"/>
  </g>

  <!-- Bottom Technical Row -->
  <g transform="translate(40, 132)">
    <!-- Blinking Dot -->
    <circle cx="5" cy="-3" r="3" fill="#09DBC7" filter="url(#glow-cyan)">
      <animate attributeName="opacity" values="1;0.2;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="15" y="0" class="hud-mono-bold" fill="#09DBC7">SYS: ACTIVE</text>
    
    <text x="130" y="0" class="hud-mono">| DECRYPT_KEY: NEXUS_V2</text>
    <text x="350" y="0" class="hud-mono">| COGNITIVE NODE: 84c703a0</text>
    
    <!-- System Status indicator -->
    <rect x="520" y="-12" width="95" height="16" fill="#0D1A2F" stroke="#09DBC7" stroke-width="1"/>
    <text x="525" y="0" font-family="Share Tech Mono" font-size="9" fill="#09DBC7" font-weight="bold">STATUS: NOMINAL</text>
  </g>
</svg>
