<svg width="800" height="240" viewBox="0 0 800 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style type="text/css"><![CDATA[
      @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Share+Tech+Mono&display=swap');
      .hud-header {
        font-family: 'Orbitron', -apple-system, sans-serif;
        font-weight: 700;
        font-size: 13px;
        fill: #09DBC7;
        letter-spacing: 2px;
      }
      .hud-label {
        font-family: 'Share Tech Mono', monospace;
        font-size: 11px;
        font-weight: bold;
        fill: #94A3B8;
        letter-spacing: 1px;
      }
      .hud-value {
        font-family: 'Share Tech Mono', monospace;
        font-size: 12px;
        fill: #FFFFFF;
      }
      .hud-value-cyan {
        font-family: 'Share Tech Mono', monospace;
        font-size: 12px;
        fill: #09DBC7;
        font-weight: bold;
      }
      .hud-value-red {
        font-family: 'Share Tech Mono', monospace;
        font-size: 12px;
        fill: #BD0927;
        font-weight: bold;
      }
      .hud-desc {
        font-family: 'Share Tech Mono', monospace;
        font-size: 11px;
        fill: #94A3B8;
        line-height: 1.5;
      }
      .hud-badge-text {
        font-family: 'Share Tech Mono', monospace;
        font-size: 9px;
        font-weight: bold;
        fill: #FFFFFF;
      }
    ]]></style>
    
    <!-- Background Grid -->
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#17364F" stroke-width="0.75" opacity="0.25"/>
    </pattern>

    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1A2F"/>
      <stop offset="100%" stop-color="#070F1C"/>
    </linearGradient>

    <!-- Scanline overlay pattern -->
    <pattern id="scanlines" width="100" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="100" y2="0" stroke="#000000" stroke-width="1.5" opacity="0.3"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="240" fill="url(#bgGrad)"/>
  <rect width="800" height="240" fill="url(#grid)"/>
  <rect x="10" y="10" width="780" height="220" fill="none" stroke="#17364F" stroke-width="1"/>

  <!-- LEFT SECTION: OPERATIVE VIEWPORT -->
  <g transform="translate(20, 20)">
    <!-- Outer viewport frame -->
    <rect width="200" height="200" fill="#050B14" stroke="#17364F" stroke-width="2"/>
    
    <!-- Viewport Camera Image (Agent Image) -->
    <image x="2" y="2" width="196" height="196" href="186774197.jpg" preserveAspectRatio="xMidYMid slice" opacity="0.85"/>
    
    <!-- Camera Overlay (Static / Scanning Line) -->
    <rect width="200" height="200" fill="url(#scanlines)" pointer-events="none"/>
    
    <!-- Tech Frame Corners -->
    <path d="M 2 15 L 2 2 L 15 2" fill="none" stroke="#09DBC7" stroke-width="2"/>
    <path d="M 185 2 L 198 2 L 198 15" fill="none" stroke="#09DBC7" stroke-width="2"/>
    <path d="M 2 185 L 2 198 L 15 198" fill="none" stroke="#09DBC7" stroke-width="2"/>
    <path d="M 185 198 L 198 198 L 198 185" fill="none" stroke="#09DBC7" stroke-width="2"/>

    <!-- Animated Scanning Line -->
    <line x1="0" y1="0" x2="200" y2="0" stroke="#09DBC7" stroke-width="2" opacity="0.8">
      <animate attributeName="y1" values="2;198;2" dur="4s" repeatCount="indefinite" />
      <animate attributeName="y2" values="2;198;2" dur="4s" repeatCount="indefinite" />
    </line>

    <!-- REC Indicator -->
    <circle cx="15" cy="15" r="4" fill="#BD0927">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <text x="25" y="18" font-family="Share Tech Mono" font-size="8" fill="#BD0927" font-weight="bold">FEED: LIVE</text>
    
    <!-- Status footer of camera -->
    <rect x="2" y="178" width="196" height="20" fill="#0D1A2F" fill-opacity="0.9"/>
    <text x="8" y="191" font-family="Share Tech Mono" font-size="9" fill="#09DBC7">NODE_DEC // 84c703a0</text>
  </g>

  <!-- RIGHT SECTION: OPERATIVE METADATA DOSSIER -->
  <g transform="translate(240, 20)">
    <!-- Header -->
    <text x="10" y="15" class="hud-header">[ OPERATIVE SPECIFICATION ]</text>
    <line x1="10" y1="23" x2="530" y2="23" stroke="#17364F" stroke-width="1.5"/>
    <rect x="10" y="23" width="60" height="2" fill="#09DBC7"/>

    <!-- Spec Fields (Table-like grid) -->
    <!-- Row 1 -->
    <g transform="translate(10, 40)">
      <text x="0" y="10" class="hud-label">CODENAME</text>
      <text x="120" y="10" class="hud-value-cyan">V. T. G. HUY // SYSTEM ARCHITECT</text>
      <line x1="0" y1="18" x2="520" y2="18" stroke="#17364F" stroke-width="0.5" stroke-dasharray="2,2"/>
    </g>

    <!-- Row 2 -->
    <g transform="translate(10, 65)">
      <text x="0" y="10" class="hud-label">CORE ARCHITECTURE</text>
      <text x="120" y="10" class="hud-value">AI RAG &amp; VECTOR RETRIEVAL PIPELINES</text>
      <line x1="0" y1="18" x2="520" y2="18" stroke="#17364F" stroke-width="0.5" stroke-dasharray="2,2"/>
    </g>

    <!-- Row 3 -->
    <g transform="translate(10, 90)">
      <text x="0" y="10" class="hud-label">SIMULATION NODE</text>
      <text x="120" y="10" class="hud-value">UNITY ENGINE &amp; GAMEPLAY SIMULATOR (C# / C++)</text>
      <line x1="0" y1="18" x2="520" y2="18" stroke="#17364F" stroke-width="0.5" stroke-dasharray="2,2"/>
    </g>

    <!-- Row 4 -->
    <g transform="translate(10, 115)">
      <text x="0" y="10" class="hud-label">OPERATIVE LEVEL</text>
      <text x="120" y="10" class="hud-value-red">SECURE CORE // LOCAL NETWORK ENCRYPTED</text>
      <line x1="0" y1="18" x2="520" y2="18" stroke="#17364F" stroke-width="0.5" stroke-dasharray="2,2"/>
    </g>

    <!-- Tactical Analysis Log Section -->
    <g transform="translate(10, 140)">
      <rect x="0" y="0" width="520" height="60" fill="#17364F" fill-opacity="0.15" stroke="#17364F" stroke-width="1"/>
      <path d="M 0 0 L 10 0 L 0 10 Z" fill="#09DBC7"/>
      <text x="10" y="15" class="hud-mono-bold" font-size="9" fill="#09DBC7">// SPECTRUM SCANNER LOG:</text>
      
      <text x="10" y="32" class="hud-desc" font-size="10">Specializes in architecting local RAG models over secure corporate spaces.</text>
      <text x="10" y="46" class="hud-desc" font-size="10">Deploys optimized C# game servers and resource simulation logic matrix.</text>
    </g>

    <!-- Tech Badges inside Card -->
    <!-- Badge 1 (Teal) -->
    <g transform="translate(320, 5)">
      <rect width="60" height="14" fill="#0D1A2F" stroke="#09DBC7" stroke-width="1"/>
      <rect width="4" height="14" fill="#09DBC7"/>
      <text x="8" y="10" class="hud-badge-text" fill="#09DBC7">RAG // AI</text>
    </g>
    <!-- Badge 2 (Red) -->
    <g transform="translate(390, 5)">
      <rect width="65" height="14" fill="#0D1A2F" stroke="#BD0927" stroke-width="1"/>
      <rect width="4" height="14" fill="#BD0927"/>
      <text x="8" y="10" class="hud-badge-text" fill="#BD0927">UNITY // SIM</text>
    </g>
    <!-- Badge 3 (Muted Blue) -->
    <g transform="translate(465, 5)">
      <rect width="55" height="14" fill="#0D1A2F" stroke="#17364F" stroke-width="1"/>
      <rect width="4" height="14" fill="#17364F"/>
      <text x="8" y="10" class="hud-badge-text" fill="#94A3B8">SYS_CORE</text>
    </g>
  </g>
</svg>
