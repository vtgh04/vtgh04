<svg width="390" height="170" viewBox="0 0 390 170" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Fonts -->
    <style type="text/css"><![CDATA[
      @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Share+Tech+Mono&display=swap');
      .hud-title {
        font-family: 'Orbitron', -apple-system, sans-serif;
        font-weight: 700;
        font-size: 11px;
        fill: #FFFFFF;
        letter-spacing: 2px;
      }
      .hud-label {
        font-family: 'Share Tech Mono', monospace;
        font-size: 10px;
        fill: #888888;
        letter-spacing: 1px;
      }
      .hud-val {
        font-family: 'Share Tech Mono', monospace;
        font-size: 11px;
        fill: #FFFFFF;
        font-weight: bold;
      }
      .hud-val-active {
        font-family: 'Share Tech Mono', monospace;
        font-size: 11px;
        fill: #FFFFFF;
        font-weight: bold;
        text-shadow: 0 0 4px #ffffff;
      }
      .hud-val-dim {
        font-family: 'Share Tech Mono', monospace;
        font-size: 11px;
        fill: #CCCCCC;
        font-weight: bold;
      }
    ]]></style>
    
    <!-- Background Grid -->
    <pattern id="grid" width="15" height="15" patternUnits="userSpaceOnUse">
      <path d="M 15 0 L 0 0 0 15" fill="none" stroke="#222222" stroke-width="0.5" opacity="0.25"/>
    </pattern>

    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070707"/>
      <stop offset="100%" stop-color="#141414"/>
    </linearGradient>
    
    <!-- Glowing effect -->
    <filter id="glow-white" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="390" height="170" fill="url(#bgGrad)"/>
  <rect width="390" height="170" fill="url(#grid)"/>
  
  <!-- Outer double-lined borders with diagonal cuts -->
  <path d="M 8 8 L 360 8 L 372 20 L 382 20 L 382 162 L 8 162 Z" fill="none" stroke="#333333" stroke-width="1" />
  <path d="M 10 10 L 358 10 L 370 22 L 380 22 L 380 160 L 10 160 Z" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.8" />
  
  <!-- Corner Tech Highlights -->
  <path d="M 6 25 L 6 6 L 25 6" fill="none" stroke="#ffffff" stroke-width="2"/>
  <path d="M 365 6 L 384 6 L 384 25" fill="none" stroke="#333333" stroke-width="1.5"/>
  <path d="M 6 145 L 6 164 L 25 164" fill="none" stroke="#333333" stroke-width="1.5"/>
  <path d="M 365 164 L 384 164 L 384 145" fill="none" stroke="#ffffff" stroke-width="2"/>

  <!-- Left Accent Stripe -->
  <rect x="14" y="18" width="2" height="134" fill="#ffffff" opacity="0.4"/>

  <!-- Content Group -->
  <!-- Title -->
  <text x="24" y="26" class="hud-title">[ TELEMETRY DIAGNOSTICS ]</text>
  <line x1="24" y1="30" x2="250" y2="30" stroke="#333333" stroke-width="1"/>
  <rect x="24" y="30" width="40" height="1.5" fill="#ffffff"/>

  <!-- Stats Rows -->
  <g transform="translate(24, 38)">
    <!-- Row 1 -->
    <g transform="translate(0, 10)">
      <text x="0" y="8" class="hud-label">ADDR_0x0A // COMMITS</text>
      <text x="135" y="8" class="hud-val">384</text>
      <line x1="0" y1="14" x2="200" y2="14" stroke="#222222" stroke-dasharray="2,2"/>
    </g>
    
    <!-- Row 2 -->
    <g transform="translate(0, 32)">
      <text x="0" y="8" class="hud-label">ADDR_0x0B // CONTRIBUTIONS</text>
      <text x="135" y="8" class="hud-val-active">142</text>
      <line x1="0" y1="14" x2="200" y2="14" stroke="#222222" stroke-dasharray="2,2"/>
    </g>

    <!-- Row 3 -->
    <g transform="translate(0, 54)">
      <text x="0" y="8" class="hud-label">ADDR_0x0C // PULL_REQS</text>
      <text x="135" y="8" class="hud-val">28</text>
      <line x1="0" y1="14" x2="200" y2="14" stroke="#222222" stroke-dasharray="2,2"/>
    </g>

    <!-- Row 4 -->
    <g transform="translate(0, 76)">
      <text x="0" y="8" class="hud-label">ADDR_0x0D // FORKED_REPOS</text>
      <text x="135" y="8" class="hud-val">12</text>
      <line x1="0" y1="14" x2="200" y2="14" stroke="#222222" stroke-dasharray="2,2"/>
    </g>

    <!-- Row 5 -->
    <g transform="translate(0, 98)">
      <text x="0" y="8" class="hud-label">ADDR_0x0E // STARS_RECV</text>
      <text x="135" y="8" class="hud-val-dim">18</text>
      <line x1="0" y1="14" x2="200" y2="14" stroke="#222222" stroke-dasharray="2,2"/>
    </g>
  </g>

  <!-- Right Graphic Visual (Grayscale Tech Radar Widget) -->
  <g transform="translate(305, 82)">
    <circle cx="0" cy="0" r="38" fill="none" stroke="#222222" stroke-width="1"/>
    <circle cx="0" cy="0" r="28" fill="none" stroke="#333333" stroke-width="0.75" stroke-dasharray="3,3"/>
    
    <!-- Crosshairs -->
    <line x1="-45" y1="0" x2="-33" y2="0" stroke="#333333" stroke-width="1"/>
    <line x1="33" y1="0" x2="45" y2="0" stroke="#333333" stroke-width="1"/>
    <line x1="0" y1="-45" x2="0" y2="-33" stroke="#333333" stroke-width="1"/>
    <line x1="0" y1="33" x2="0" y2="45" stroke="#333333" stroke-width="1"/>
    
    <!-- Sweeper line -->
    <line x1="0" y1="0" x2="25" y2="-25" stroke="#ffffff" stroke-width="1.5" opacity="0.8">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="5s" repeatCount="indefinite"/>
    </line>

    <!-- Sweeper dot -->
    <circle cx="18" cy="-18" r="3" fill="#ffffff" filter="url(#glow-white)">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    
    <!-- Decorative brackets around gauge -->
    <path d="M -30 -30 A 42 42 0 0 1 30 -30" fill="none" stroke="#ffffff" stroke-width="1.5"/>
    <path d="M -30 30 A 42 42 0 0 0 30 30" fill="none" stroke="#333333" stroke-width="1"/>

    <!-- Small label -->
    <text x="-25" y="55" font-family="Share Tech Mono" font-size="7" fill="#888888" letter-spacing="1">TELEMETRY_OK</text>
  </g>
</svg>
