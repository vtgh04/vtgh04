<svg width="390" height="170" viewBox="0 0 390 170" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style type="text/css"><![CDATA[
      @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Share+Tech+Mono&display=swap');
      .hud-title {
        font-family: 'Orbitron', -apple-system, sans-serif;
        font-weight: 700;
        font-size: 11px;
        fill: #09DBC7;
        letter-spacing: 2px;
      }
      .hud-label {
        font-family: 'Share Tech Mono', monospace;
        font-size: 10px;
        fill: #94A3B8;
        letter-spacing: 1px;
      }
      .hud-val {
        font-family: 'Share Tech Mono', monospace;
        font-size: 11px;
        fill: #FFFFFF;
        font-weight: bold;
      }
      .hud-val-cyan {
        font-family: 'Share Tech Mono', monospace;
        font-size: 11px;
        fill: #09DBC7;
        font-weight: bold;
      }
      .hud-val-red {
        font-family: 'Share Tech Mono', monospace;
        font-size: 11px;
        fill: #BD0927;
        font-weight: bold;
      }
    ]]></style>
    
    <!-- Background Grid -->
    <pattern id="grid" width="15" height="15" patternUnits="userSpaceOnUse">
      <path d="M 15 0 L 0 0 0 15" fill="none" stroke="#17364F" stroke-width="0.5" opacity="0.2"/>
    </pattern>

    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1A2F"/>
      <stop offset="100%" stop-color="#070F1C"/>
    </linearGradient>
    
    <filter id="glow-red" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="390" height="170" fill="url(#bgGrad)"/>
  <rect width="390" height="170" fill="url(#grid)"/>
  
  <!-- Outer Frame -->
  <rect x="6" y="6" width="378" height="158" fill="none" stroke="#17364F" stroke-width="1" opacity="0.8"/>
  
  <!-- Corner Technical Accents -->
  <path d="M 6 20 L 6 6 L 20 6" fill="none" stroke="#09DBC7" stroke-width="2"/>
  <path d="M 370 6 L 384 6 L 384 20" fill="none" stroke="#17364F" stroke-width="1.5"/>
  <path d="M 6 150 L 6 164 L 20 164" fill="none" stroke="#17364F" stroke-width="1.5"/>
  <path d="M 370 164 L 384 164 L 384 150" fill="none" stroke="#BD0927" stroke-width="2"/>

  <!-- Left Accent Stripe -->
  <rect x="10" y="15" width="2" height="140" fill="#BD0927"/>

  <!-- Content Group -->
  <!-- Title -->
  <text x="20" y="24" class="hud-title">[ TACTICAL DIAGNOSTICS ]</text>
  <line x1="20" y1="28" x2="250" y2="28" stroke="#17364F" stroke-width="1"/>
  <rect x="20" y="28" width="40" height="1.5" fill="#09DBC7"/>

  <!-- Stats Rows -->
  <g transform="translate(20, 35)">
    <!-- Row 1 -->
    <g transform="translate(0, 10)">
      <text x="0" y="8" class="hud-label">TOTAL COMMITS</text>
      <text x="130" y="8" class="hud-val">384</text>
      <line x1="0" y1="14" x2="200" y2="14" stroke="#17364F" stroke-dasharray="2,2" opacity="0.5"/>
    </g>
    
    <!-- Row 2 -->
    <g transform="translate(0, 32)">
      <text x="0" y="8" class="hud-label">CONTRIBUTIONS</text>
      <text x="130" y="8" class="hud-val-cyan">142</text>
      <line x1="0" y1="14" x2="200" y2="14" stroke="#17364F" stroke-dasharray="2,2" opacity="0.5"/>
    </g>

    <!-- Row 3 -->
    <g transform="translate(0, 54)">
      <text x="0" y="8" class="hud-label">PULL REQUESTS</text>
      <text x="130" y="8" class="hud-val">28</text>
      <line x1="0" y1="14" x2="200" y2="14" stroke="#17364F" stroke-dasharray="2,2" opacity="0.5"/>
    </g>

    <!-- Row 4 -->
    <g transform="translate(0, 76)">
      <text x="0" y="8" class="hud-label">REPOS FORKED</text>
      <text x="130" y="8" class="hud-val">12</text>
      <line x1="0" y1="14" x2="200" y2="14" stroke="#17364F" stroke-dasharray="2,2" opacity="0.5"/>
    </g>

    <!-- Row 5 -->
    <g transform="translate(0, 98)">
      <text x="0" y="8" class="hud-label">PROJECT STARS</text>
      <text x="130" y="8" class="hud-val-red">18</text>
      <line x1="0" y1="14" x2="200" y2="14" stroke="#17364F" stroke-dasharray="2,2" opacity="0.5"/>
    </g>
  </g>

  <!-- Right Graphic Visual (Tech Circle/Radar Mockup) -->
  <g transform="translate(295, 80)">
    <circle cx="0" cy="0" r="38" fill="none" stroke="#17364F" stroke-width="1"/>
    <circle cx="0" cy="0" r="28" fill="none" stroke="#17364F" stroke-width="0.75" stroke-dasharray="3,3"/>
    
    <!-- Crosshairs -->
    <line x1="-45" y1="0" x2="-30" y2="0" stroke="#17364F" stroke-width="1"/>
    <line x1="30" y1="0" x2="45" y2="0" stroke="#17364F" stroke-width="1"/>
    <line x1="0" y1="-45" x2="0" y2="-30" stroke="#17364F" stroke-width="1"/>
    <line x1="0" y1="30" x2="0" y2="45" stroke="#17364F" stroke-width="1"/>
    
    <!-- Sweeper dot -->
    <circle cx="18" cy="-18" r="3" fill="#BD0927" filter="url(#glow-red)">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    
    <!-- Decorative brackets around gauge -->
    <path d="M -30 -30 A 42 42 0 0 1 30 -30" fill="none" stroke="#09DBC7" stroke-width="1.5"/>
    <path d="M -30 30 A 42 42 0 0 0 30 30" fill="none" stroke="#17364F" stroke-width="1"/>

    <!-- Small label -->
    <text x="-25" y="55" font-family="Share Tech Mono" font-size="7" fill="#94A3B8" letter-spacing="1">TELEMETRY_OK</text>
  </g>
</svg>
