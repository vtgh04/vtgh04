<svg width="390" height="170" viewBox="0 0 390 170" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Fonts -->
    <style type="text/css"><![CDATA[
      @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Share+Tech+Mono&display=swap');
      .hud-title {
        font-family: 'Orbitron', -apple-system, sans-serif;
        font-weight: 700;
        font-size: 11px;
        fill: #FFFFFF;
        letter-spacing: 2px;
      }
      .hud-label {
        font-family: 'Share Tech Mono', monospace;
        font-size: 10px;
        fill: #888888;
        letter-spacing: 1px;
      }
      .hud-val-white {
        font-family: 'Share Tech Mono', monospace;
        font-size: 9px;
        fill: #FFFFFF;
        font-weight: bold;
      }
      .hud-val-dim {
        font-family: 'Share Tech Mono', monospace;
        font-size: 9px;
        fill: #888888;
        font-weight: bold;
      }
    ]]></style>
    
    <!-- Background Grid -->
    <pattern id="grid" width="15" height="15" patternUnits="userSpaceOnUse">
      <path d="M 15 0 L 0 0 0 15" fill="none" stroke="#222222" stroke-width="0.5" opacity="0.25"/>
    </pattern>

    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070707"/>
      <stop offset="100%" stop-color="#141414"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="390" height="170" fill="url(#bgGrad)"/>
  <rect width="390" height="170" fill="url(#grid)"/>
  
  <!-- Outer double borders with diagonal cuts -->
  <path d="M 8 8 L 360 8 L 372 20 L 382 20 L 382 162 L 8 162 Z" fill="none" stroke="#333333" stroke-width="1" />
  <path d="M 10 10 L 358 10 L 370 22 L 380 22 L 380 160 L 10 160 Z" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.8" />
  
  <!-- Corner Tech Highlights -->
  <path d="M 6 25 L 6 6 L 25 6" fill="none" stroke="#ffffff" stroke-width="2"/>
  <path d="M 365 6 L 384 6 L 384 25" fill="none" stroke="#333333" stroke-width="1.5"/>
  <path d="M 6 145 L 6 164 L 25 164" fill="none" stroke="#333333" stroke-width="1.5"/>
  <path d="M 365 164 L 384 164 L 384 145" fill="none" stroke="#ffffff" stroke-width="2"/>

  <!-- Left Accent Stripe -->
  <rect x="14" y="18" width="2" height="134" fill="#ffffff" opacity="0.4"/>

  <!-- Title -->
  <text x="24" y="26" class="hud-title">[ SYSTEMS MATRIX ]</text>
  <line x1="24" y1="30" x2="250" y2="30" stroke="#333333" stroke-width="1"/>
  <rect x="24" y="30" width="40" height="1.5" fill="#ffffff"/>

  <!-- Skills Columns -->
  <!-- Column 1 (Frontend Modules) -->
  <g transform="translate(24, 36)">
    <!-- Section Header -->
    <text x="0" y="8" font-family="Orbitron" font-size="8" fill="#ffffff" letter-spacing="1">FE_MODULES</text>
    <line x1="0" y1="12" x2="155" y2="12" stroke="#333333" stroke-width="0.5"/>
    
    <!-- HTML -->
    <g transform="translate(0, 22)">
      <text x="0" y="8" class="hud-label">HTML</text>
      <rect x="58" y="2" width="70" height="6" fill="#111111" stroke="#333333" stroke-width="0.5"/>
      <rect x="60" y="4" width="60" height="2" fill="#ffffff"/>
      <text x="134" y="8" class="hud-val-white">90%</text>
    </g>

    <!-- CSS -->
    <g transform="translate(0, 44)">
      <text x="0" y="8" class="hud-label">CSS</text>
      <rect x="58" y="2" width="70" height="6" fill="#111111" stroke="#333333" stroke-width="0.5"/>
      <rect x="60" y="4" width="56" height="2" fill="#ffffff"/>
      <text x="134" y="8" class="hud-val-white">80%</text>
    </g>

    <!-- TAILWIND -->
    <g transform="translate(0, 66)">
      <text x="0" y="8" class="hud-label">TAILWIND</text>
      <rect x="58" y="2" width="70" height="6" fill="#111111" stroke="#333333" stroke-width="0.5"/>
      <rect x="60" y="4" width="56" height="2" fill="#ffffff"/>
      <text x="134" y="8" class="hud-val-white">80%</text>
    </g>

    <!-- FIGMA -->
    <g transform="translate(0, 88)">
      <text x="0" y="8" class="hud-label">FIGMA</text>
      <rect x="58" y="2" width="70" height="6" fill="#111111" stroke="#333333" stroke-width="0.5"/>
      <rect x="60" y="4" width="46" height="2" fill="#ffffff" opacity="0.6"/>
      <text x="134" y="8" class="hud-val-dim">65%</text>
    </g>
  </g>

  <!-- Column 2 (Backend Engine) -->
  <g transform="translate(205, 36)">
    <!-- Section Header -->
    <text x="0" y="8" font-family="Orbitron" font-size="8" fill="#ffffff" letter-spacing="1">BE_ENGINE</text>
    <line x1="0" y1="12" x2="155" y2="12" stroke="#333333" stroke-width="0.5"/>

    <!-- JAVA -->
    <g transform="translate(0, 22)">
      <text x="0" y="8" class="hud-label">JAVA</text>
      <rect x="58" y="2" width="70" height="6" fill="#111111" stroke="#333333" stroke-width="0.5"/>
      <rect x="60" y="4" width="50" height="2" fill="#ffffff"/>
      <text x="134" y="8" class="hud-val-white">75%</text>
    </g>

    <!-- PYTHON -->
    <g transform="translate(0, 44)">
      <text x="0" y="8" class="hud-label">PYTHON</text>
      <rect x="58" y="2" width="70" height="6" fill="#111111" stroke="#333333" stroke-width="0.5"/>
      <rect x="60" y="4" width="56" height="2" fill="#ffffff"/>
      <text x="134" y="8" class="hud-val-white">80%</text>
    </g>

    <!-- SQL -->
    <g transform="translate(0, 66)">
      <text x="0" y="8" class="hud-label">SQL</text>
      <rect x="58" y="2" width="70" height="6" fill="#111111" stroke="#333333" stroke-width="0.5"/>
      <rect x="60" y="4" width="56" height="2" fill="#ffffff"/>
      <text x="134" y="8" class="hud-val-white">80%</text>
    </g>

    <!-- MONGODB -->
    <g transform="translate(0, 88)">
      <text x="0" y="8" class="hud-label">MONGODB</text>
      <rect x="58" y="2" width="70" height="6" fill="#111111" stroke="#333333" stroke-width="0.5"/>
      <rect x="60" y="4" width="46" height="2" fill="#ffffff" opacity="0.6"/>
      <text x="134" y="8" class="hud-val-dim">65%</text>
    </g>
  </g>
</svg>
