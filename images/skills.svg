<svg width="390" height="170" viewBox="0 0 390 170" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style type="text/css"><![CDATA[
      @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Share+Tech+Mono&display=swap');
      .hud-title {
        font-family: 'Orbitron', -apple-system, sans-serif;
        font-weight: 700;
        font-size: 11px;
        fill: #09DBC7;
        letter-spacing: 2px;
      }
      .hud-label {
        font-family: 'Share Tech Mono', monospace;
        font-size: 10px;
        fill: #94A3B8;
        letter-spacing: 1px;
      }
      .hud-val-cyan {
        font-family: 'Share Tech Mono', monospace;
        font-size: 9px;
        fill: #09DBC7;
        font-weight: bold;
      }
      .hud-val-red {
        font-family: 'Share Tech Mono', monospace;
        font-size: 9px;
        fill: #BD0927;
        font-weight: bold;
      }
    ]]></style>
    
    <!-- Background Grid -->
    <pattern id="grid" width="15" height="15" patternUnits="userSpaceOnUse">
      <path d="M 15 0 L 0 0 0 15" fill="none" stroke="#17364F" stroke-width="0.5" opacity="0.2"/>
    </pattern>

    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1A2F"/>
      <stop offset="100%" stop-color="#070F1C"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="390" height="170" fill="url(#bgGrad)"/>
  <rect width="390" height="170" fill="url(#grid)"/>
  
  <!-- Outer Frame -->
  <rect x="6" y="6" width="378" height="158" fill="none" stroke="#17364F" stroke-width="1" opacity="0.8"/>
  
  <!-- Corner Technical Accents -->
  <path d="M 6 20 L 6 6 L 20 6" fill="none" stroke="#09DBC7" stroke-width="2"/>
  <path d="M 370 6 L 384 6 L 384 20" fill="none" stroke="#17364F" stroke-width="1.5"/>
  <path d="M 6 150 L 6 164 L 20 164" fill="none" stroke="#17364F" stroke-width="1.5"/>
  <path d="M 370 164 L 384 164 L 384 150" fill="none" stroke="#BD0927" stroke-width="2"/>

  <!-- Left Accent Stripe -->
  <rect x="10" y="15" width="2" height="140" fill="#09DBC7"/>

  <!-- Title -->
  <text x="20" y="24" class="hud-title">[ TECH MATRIX ]</text>
  <line x1="20" y1="28" x2="250" y2="28" stroke="#17364F" stroke-width="1"/>
  <rect x="20" y="28" width="40" height="1.5" fill="#09DBC7"/>

  <!-- Skills Columns -->
  <!-- Column 1 (Frontend & Design - Cyan theme) -->
  <g transform="translate(20, 36)">
    <!-- Row 1: HTML -->
    <g transform="translate(0, 10)">
      <text x="0" y="8" class="hud-label">HTML</text>
      <!-- HTML Icon: <> shape -->
      <path d="M 38 2 L 34 5 L 38 8 M 42 2 L 46 5 L 42 8" stroke="#09DBC7" stroke-width="1" fill="none"/>
      
      <rect x="70" y="2" width="80" height="6" fill="#17364F" fill-opacity="0.5" stroke="#17364F" stroke-width="0.5"/>
      <rect x="72" y="4" width="68" height="2" fill="#09DBC7"/>
      <text x="156" y="8" class="hud-val-cyan">90%</text>
    </g>

    <!-- Row 2: CSS -->
    <g transform="translate(0, 32)">
      <text x="0" y="8" class="hud-label">CSS</text>
      <!-- CSS Icon: {} shape -->
      <path d="M 30 2 C 28 2 28 5 26 5 C 28 5 28 8 30 8 M 34 2 C 36 2 36 5 38 5 C 36 5 36 8 34 8" stroke="#09DBC7" stroke-width="1" fill="none"/>
      
      <rect x="70" y="2" width="80" height="6" fill="#17364F" fill-opacity="0.5" stroke="#17364F" stroke-width="0.5"/>
      <rect x="72" y="4" width="65" height="2" fill="#09DBC7"/>
      <text x="156" y="8" class="hud-val-cyan">85%</text>
    </g>

    <!-- Row 3: TAIWIND -->
    <g transform="translate(0, 54)">
      <text x="0" y="8" class="hud-label">TAIWIND</text>
      <!-- Tailwind Icon: waves -->
      <path d="M 52 4 C 55 1 59 3 59 5 C 59 7 55 8 52 8 Z M 57 7 C 60 4 64 6 64 8 C 64 10 60 11 57 11 Z" fill="#09DBC7" fill-opacity="0.8"/>
      
      <rect x="70" y="2" width="80" height="6" fill="#17364F" fill-opacity="0.5" stroke="#17364F" stroke-width="0.5"/>
      <rect x="72" y="4" width="65" height="2" fill="#09DBC7"/>
      <text x="156" y="8" class="hud-val-cyan">85%</text>
    </g>

    <!-- Row 4: FIGMA -->
    <g transform="translate(0, 76)">
      <text x="0" y="8" class="hud-label">FIGMA</text>
      <!-- Figma Icon: 3 circles stacked -->
      <g transform="translate(38, -1)" opacity="0.9">
        <path d="M 3 2 A 1.8 1.8 0 0 0 1 3.8 C 1 4.8 1.8 5.6 3 5.6 L 3 2 Z" fill="#09DBC7"/>
        <circle cx="5.7" cy="3.8" r="1.8" fill="#09DBC7"/>
        <path d="M 3 5.6 A 1.8 1.8 0 0 0 1 7.4 C 1 8.4 1.8 9.2 3 9.2 L 3 5.6 Z" fill="#09DBC7"/>
        <circle cx="5.7" cy="7.4" r="1.8" fill="#09DBC7"/>
        <path d="M 3 9.2 A 1.8 1.8 0 0 0 1 11 A 1.8 1.8 0 0 0 3 12.8 L 3 9.2 Z" fill="#09DBC7"/>
      </g>
      
      <rect x="70" y="2" width="80" height="6" fill="#17364F" fill-opacity="0.5" stroke="#17364F" stroke-width="0.5"/>
      <rect x="72" y="4" width="53" height="2" fill="#09DBC7"/>
      <text x="156" y="8" class="hud-val-cyan">70%</text>
    </g>
  </g>

  <!-- Column 2 (Backend & Database - Red theme) -->
  <g transform="translate(205, 36)">
    <!-- Row 1: JAVA -->
    <g transform="translate(0, 10)">
      <text x="0" y="8" class="hud-label">JAVA</text>
      <!-- Java Icon: Coffee cup -->
      <g transform="translate(30, -1)" opacity="0.9">
        <path d="M 0 4 L 6 4 C 6 6.5 4 8.5 2 8.5 C 0 8.5 0 6.5 0 4 Z" fill="#BD0927"/>
        <path d="M 6 5 C 7.5 5 7.5 7 6 7" stroke="#BD0927" stroke-width="0.8" fill="none"/>
        <path d="M 2 1 C 2 0.2 2.5 -0.5 2 -1 M 4 1 C 4 0.2 4.5 -0.5 4 -1" stroke="#BD0927" stroke-width="0.6" fill="none"/>
      </g>
      
      <rect x="70" y="2" width="80" height="6" fill="#17364F" fill-opacity="0.5" stroke="#17364F" stroke-width="0.5"/>
      <rect x="72" y="4" width="57" height="2" fill="#BD0927"/>
      <text x="156" y="8" class="hud-val-red">75%</text>
    </g>

    <!-- Row 2: PYTHON -->
    <g transform="translate(0, 32)">
      <text x="0" y="8" class="hud-label">PYTHON</text>
      <!-- Python Icon: simplified snakes -->
      <g transform="translate(44, -1)" opacity="0.9">
        <path d="M 2.5 1 L 5 1 C 6.5 1 6.5 2.5 5 2.5 L 3.5 2.5 C 2 2.5 2 4 2 4 L 0 4 C 0 2.5 1 1 2.5 1 Z" fill="#BD0927"/>
        <circle cx="4" cy="1.7" r="0.3" fill="#0D1A2F"/>
        <path d="M 5.5 8 L 3 8 C 1.5 8 1.5 6.5 3 6.5 L 4.5 6.5 C 6 6.5 6 5 6 5 L 8 5 C 8 6.5 7 8 5.5 8 Z" fill="#BD0927"/>
        <circle cx="4" cy="7.3" r="0.3" fill="#0D1A2F"/>
      </g>
      
      <rect x="70" y="2" width="80" height="6" fill="#17364F" fill-opacity="0.5" stroke="#17364F" stroke-width="0.5"/>
      <rect x="72" y="4" width="61" height="2" fill="#BD0927"/>
      <text x="156" y="8" class="hud-val-red">80%</text>
    </g>

    <!-- Row 3: SQL -->
    <g transform="translate(0, 54)">
      <text x="0" y="8" class="hud-label">SQL</text>
      <!-- SQL Icon: DB Stack -->
      <g transform="translate(24, 0)" opacity="0.9">
        <ellipse cx="5" cy="2.2" rx="4.5" ry="1.4" fill="none" stroke="#BD0927" stroke-width="0.8"/>
        <path d="M 0.5 2.2 L 0.5 5.2 A 4.5 1.4 0 0 0 9.5 5.2 L 9.5 2.2" fill="none" stroke="#BD0927" stroke-width="0.8"/>
        <path d="M 0.5 5.2 L 0.5 8.2 A 4.5 1.4 0 0 0 9.5 8.2 L 9.5 5.2" fill="none" stroke="#BD0927" stroke-width="0.8"/>
      </g>
      
      <rect x="70" y="2" width="80" height="6" fill="#17364F" fill-opacity="0.5" stroke="#17364F" stroke-width="0.5"/>
      <rect x="72" y="4" width="61" height="2" fill="#BD0927"/>
      <text x="156" y="8" class="hud-val-red">80%</text>
    </g>

    <!-- Row 4: MONGODB -->
    <g transform="translate(0, 76)">
      <text x="0" y="8" class="hud-label">MONGODB</text>
      <!-- MongoDB Icon: Leaf -->
      <g transform="translate(50, -1)" opacity="0.9">
        <path d="M 3 0.5 C 1 2.5 0.5 5.5 2.5 8 C 4.5 9 5 7 5 5 C 5 3 4.5 1.5 3 0.5 Z" fill="#BD0927"/>
        <path d="M 3 8 L 3 10.5" stroke="#BD0927" stroke-width="0.8"/>
      </g>
      
      <rect x="70" y="2" width="80" height="6" fill="#17364F" fill-opacity="0.5" stroke="#17364F" stroke-width="0.5"/>
      <rect x="72" y="4" width="53" height="2" fill="#BD0927"/>
      <text x="156" y="8" class="hud-val-red">70%</text>
    </g>
  </g>
</svg>
