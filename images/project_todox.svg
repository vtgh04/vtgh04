<svg width="800" height="140" viewBox="0 0 800 140" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Fonts -->
    <style type="text/css"><![CDATA[
      @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Share+Tech+Mono&display=swap');
      .proj-title {
        font-family: 'Orbitron', -apple-system, sans-serif;
        font-weight: 900;
        font-size: 15px;
        fill: #FFFFFF;
        letter-spacing: 2px;
      }
      .proj-ver {
        font-family: 'Share Tech Mono', monospace;
        font-size: 10px;
        fill: #888888;
        letter-spacing: 1px;
      }
      .proj-desc {
        font-family: 'Share Tech Mono', monospace;
        font-size: 11px;
        fill: #CCCCCC;
        line-height: 1.5;
      }
      .proj-status {
        font-family: 'Share Tech Mono', monospace;
        font-size: 10px;
        fill: #ffffff;
        font-weight: bold;
        letter-spacing: 1px;
      }
    ]]></style>
    
    <!-- Background Grid -->
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#222222" stroke-width="0.75" opacity="0.25"/>
    </pattern>

    <!-- Scanline overlay pattern -->
    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="4" y2="0" stroke="#000000" stroke-width="1" opacity="0.25"/>
    </pattern>

    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070707"/>
      <stop offset="100%" stop-color="#141414"/>
    </linearGradient>

    <!-- Glowing effect -->
    <filter id="glow-white" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="140" fill="url(#bgGrad)"/>
  <rect width="800" height="140" fill="url(#grid)"/>

  <!-- Main Card Frame with diagonal cuts -->
  <path d="M 12 12 L 740 12 L 755 27 L 788 27 L 788 128 L 12 128 Z" fill="none" stroke="#333333" stroke-width="1" />
  <path d="M 15 15 L 738 15 L 752 29 L 785 29 L 785 125 L 15 125 Z" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.8" />
  
  <!-- Left Side Accent Highlight -->
  <rect x="18" y="25" width="4" height="90" fill="#ffffff" opacity="0.4"/>
  <rect x="18" y="45" width="4" height="30" fill="#ffffff"/>

  <!-- Left Side Diagonal Cut accent -->
  <path d="M 15 15 L 30 15 L 15 30 Z" fill="#ffffff"/>

  <!-- Top Right Barcode Detail -->
  <g transform="translate(680, 20)">
    <rect x="0" y="0" width="2" height="12" fill="#ffffff" />
    <rect x="4" y="0" width="1" height="12" fill="#ffffff" />
    <rect x="7" y="0" width="3" height="12" fill="#ffffff" opacity="0.6"/>
    <rect x="12" y="0" width="1" height="12" fill="#ffffff" />
    <rect x="15" y="0" width="2" height="12" fill="#ffffff" />
  </g>

  <!-- Header Info -->
  <g transform="translate(35, 22)">
    <!-- Title -->
    <text x="0" y="15" class="proj-title">OP // TODO-X-MATRIX</text>
    <text x="210" y="13" class="proj-ver">SEC_ID // 992-MERN</text>
    
    <!-- Underline -->
    <line x1="0" y1="24" x2="740" y2="24" stroke="#333333" stroke-width="1"/>
    <rect x="0" y="24" width="120" height="2.5" fill="#ffffff"/>
  </g>

  <!-- Description Body -->
  <g transform="translate(35, 66)">
    <text x="0" y="10" class="proj-desc">A high-performance full-stack Todo application designed with clean MERN architecture.</text>
    <text x="0" y="26" class="proj-desc">Features timezone-safe queries (UTC+7), persistent bilingual context, and responsive glassmorphism.</text>
  </g>

  <!-- Bottom Interactive Bar -->
  <g transform="translate(35, 102)">
    <!-- Status Dot -->
    <circle cx="5" cy="5" r="3.5" fill="#ffffff" filter="url(#glow-white)">
      <animate attributeName="opacity" values="1;0.2;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <!-- Status Text -->
    <text x="18" y="8" class="proj-status">SYS_PLATFORM: ACTIVE [INTEGRITY_SECURE]</text>

    <!-- Initiate Access Button Graphic -->
    <g transform="translate(610, -8)">
      <path d="M 0 0 L 125 0 L 135 10 L 135 22 L 10 22 L 0 12 Z" fill="#111111" stroke="#ffffff" stroke-width="1"/>
      <path d="M 4 4 L 121 4 L 127 10 L 127 18 L 10 18 L 4 12 Z" fill="#ffffff" opacity="0.1"/>
      <text x="70" y="14" font-family="Orbitron" font-size="8.5" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">INITIATE ACCESS</text>
    </g>
  </g>

  <!-- Holographic overlay -->
  <rect x="12" y="12" width="776" height="116" fill="url(#scanlines)" pointer-events="none" opacity="0.25"/>
</svg>
